name: 'freshflow_dbt'
version: '1.0.0'
config-version: 2

profile: 'freshflow_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  freshflow_dbt:
    staging:
      +materialized: view
      +schema: silver
    dimensions:
      +materialized: table
      +schema: gold
    facts:
      +materialized: incremental
      +schema: gold

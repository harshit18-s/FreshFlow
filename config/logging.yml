# ============================================================================
# FreshFlow AI — Logging Configuration
# ============================================================================
# Structured JSON logging with context fields for pipeline observability.
#
# Fields in every log record:
#   timestamp, level, service, correlation_id, pipeline_run_id,
#   model_version, message, error_type
# ============================================================================

version: 1
disable_existing_loggers: false

# ---------- Formatters -------------------------------------------------------
formatters:
  standard:
    format: "%(asctime)s [%(levelname)-8s] %(name)s — %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"

  json:
    class: structlog.stdlib.ProcessorFormatter
    processor: structlog.dev.ConsoleRenderer
    foreign_pre_chain:
      - structlog.stdlib.add_log_level
      - structlog.stdlib.add_logger_name
      - structlog.processors.TimeStamper(fmt="iso")
      - structlog.processors.StackInfoRenderer()

  structured:
    class: structlog.stdlib.ProcessorFormatter
    processor: structlog.processors.JSONRenderer
    foreign_pre_chain:
      - structlog.stdlib.add_log_level
      - structlog.stdlib.add_logger_name
      - structlog.contextvars.merge_contextvars
      - structlog.processors.TimeStamper(fmt="iso")
      - structlog.processors.StackInfoRenderer()
      - structlog.processors.format_exc_info

# ---------- Handlers ---------------------------------------------------------
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: structured
    filename: logs/freshflow.log
    maxBytes: 10485760        # 10 MB
    backupCount: 5
    encoding: utf-8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: structured
    filename: logs/freshflow-errors.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

# ---------- Loggers ----------------------------------------------------------
loggers:
  freshflow:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false

  freshflow.ingestion:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  freshflow.ml:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  freshflow.api:
    level: INFO
    handlers: [console, file]
    propagate: false

  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false

# ---------- Root logger ------------------------------------------------------
root:
  level: WARNING
  handlers: [console, file]

# ============================================================================
# structlog configuration (applied programmatically in src/__init__.py)
# ============================================================================
# Shared context fields added to every log entry:
#
#   structlog.contextvars.bind_contextvars(
#       service="freshflow",
#       correlation_id=str(uuid4()),
#       pipeline_run_id=None,
#       model_version=None,
#       error_type=None,
#   )
# ============================================================================

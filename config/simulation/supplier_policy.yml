# Version History
# ----------------------------------------------------------------------------
changelog:
  - version: "0.1.0"
    date: "2026-07-16"
    author: "FreshFlow AI Team"
    changes:
      - "Initial supplier policy simulation config"
      - "Three delivery schedule templates"
      - "Four replenishment policies (lean, conservative, balanced, aggressive)"
      - "What-if simulation parameters"

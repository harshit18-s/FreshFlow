# ============================================================================
# FreshFlow AI — Python Project Configuration
# ============================================================================

[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshflow-ai"
version = "0.1.0"
description = "Stockout-Aware Retail Profit & Waste Control Tower — demand forecasting, waste prediction, and replenishment optimization."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "FreshFlow AI Team"},
]
keywords = ["retail", "demand-forecasting", "mlops", "supply-chain", "waste-reduction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies — install via: pip install -r requirements/base.txt
# Full dev setup — install via: pip install -r requirements/dev.txt
dependencies = []

[project.optional-dependencies]
base = [
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "pydantic>=2.0",
    "python-dotenv",
    "pyyaml",
    "structlog",
    "click",
    "tqdm",
    "requests",
    "boto3",
]

[project.urls]
Homepage = "https://github.com/freshflow-ai/freshflow-ai"
Documentation = "https://github.com/freshflow-ai/freshflow-ai/wiki"
Repository = "https://github.com/freshflow-ai/freshflow-ai"

# ============================================================================
# Tool Configuration
# ============================================================================

# ---------- pytest ----------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (require Docker services)",
    "data: Data quality / validation tests",
    "ml: ML model tests (training, scoring, metrics)",
    "e2e: End-to-end pipeline tests",
    "slow: Tests that take > 30 seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ---------- black -----------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

# ---------- ruff ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "E402",   # module level import not at top of file (sys.path manipulation)
    "N806",   # variable in function should be lowercase (standard ML X matrix notation)
    "RUF001", # ambiguous unicode characters (UI emojis and greek symbols)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow assert in tests

# ---------- mypy ------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false         # gradual typing — relax for now
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

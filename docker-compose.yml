# =============================================================================
# FreshFlow AI — Docker Compose (Database Setup)
# =============================================================================
# Start with: docker compose up -d postgres
# Full core:  docker compose --profile core up -d
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL — Primary analytical warehouse
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: freshflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freshflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshflow_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-freshflow_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/ddl/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freshflow_admin} -d ${POSTGRES_DB:-freshflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - freshflow-net

  # ─────────────────────────────────────────────────────────────────────────
  # MinIO — S3-compatible object storage for bronze/silver/gold layers
  # ─────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2023-08-09T23-30-22Z
    container_name: freshflow-minio
    profiles: ["core"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-freshflow_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-freshflow_minio_2026}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - freshflow-net

  # ─────────────────────────────────────────────────────────────────────────
  # MinIO bucket initializer
  # ─────────────────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: freshflow-minio-init
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set freshflow http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing freshflow/freshflow-bronze;
      mc mb --ignore-existing freshflow/freshflow-silver;
      mc mb --ignore-existing freshflow/freshflow-gold;
      mc mb --ignore-existing freshflow/mlflow-artifacts;
      echo 'Buckets created successfully';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-freshflow_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-freshflow_minio_2026}
    networks:
      - freshflow-net

  # ─────────────────────────────────────────────────────────────────────────
  # MLflow — Experiment tracking and model registry
  # ─────────────────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: freshflow-mlflow
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: "postgresql://${POSTGRES_USER:-freshflow_admin}:${POSTGRES_PASSWORD:-freshflow_dev_2026}@postgres:5432/freshflow_db"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "s3://mlflow-artifacts/"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-freshflow_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-freshflow_minio_2026}
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
    command: >
      bash -c "pip install psycopg2-binary boto3 && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://${POSTGRES_USER:-freshflow_admin}:${POSTGRES_PASSWORD:-freshflow_dev_2026}@postgres:5432/freshflow_db --default-artifact-root s3://mlflow-artifacts/"
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - freshflow-net

  # ─────────────────────────────────────────────────────────────────────────
  # Airflow — Workflow orchestration
  # ─────────────────────────────────────────────────────────────────────────
  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    container_name: freshflow-airflow-init
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-freshflow_admin}:${POSTGRES_PASSWORD:-freshflow_dev_2026}@postgres:5432/freshflow_db"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-freshflow_admin}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username $${_AIRFLOW_WWW_USER_USERNAME} \
          --password $${_AIRFLOW_WWW_USER_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@freshflow.local || true
    networks:
      - freshflow-net

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    container_name: freshflow-airflow-webserver
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-freshflow_admin}:${POSTGRES_PASSWORD:-freshflow_dev_2026}@postgres:5432/freshflow_db"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./ingestion:/opt/airflow/ingestion:ro
      - ./spark:/opt/airflow/spark:ro
      - ./config:/opt/airflow/config:ro
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - freshflow-net

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    container_name: freshflow-airflow-scheduler
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-freshflow_admin}:${POSTGRES_PASSWORD:-freshflow_dev_2026}@postgres:5432/freshflow_db"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: airflow scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./ingestion:/opt/airflow/ingestion:ro
      - ./spark:/opt/airflow/spark:ro
      - ./config:/opt/airflow/config:ro
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - freshflow-net

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 5: API Serving and Dashboard
  # ─────────────────────────────────────────────────────────────────────────
  api:
    image: python:3.11-slim
    container_name: freshflow-api
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./requirements:/app/requirements:ro
      - ./data:/opt/airflow/data
    working_dir: /app
    command: >
      bash -c "pip install -r requirements/api.txt && 
               uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - freshflow-net

  dashboard:
    image: python:3.11-slim
    container_name: freshflow-dashboard
    profiles: ["core"]
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src:ro
      - ./requirements:/app/requirements:ro
    working_dir: /app
    command: >
      bash -c "pip install -r requirements/dashboard.txt && 
               streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - freshflow-net

  # ─────────────────────────────────────────────────────────────────────────
  # Spark — Big data processing (optional profile)
  # ─────────────────────────────────────────────────────────────────────────
  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: freshflow-spark-master
    profiles: ["bigdata"]
    restart: unless-stopped
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./data:/app/data
      - ./spark:/app/spark
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - freshflow-net

  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: freshflow-spark-worker
    profiles: ["bigdata"]
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    volumes:
      - ./data:/app/data
      - ./spark:/app/spark
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - freshflow-net

  # ─────────────────────────────────────────────────────────────────────────
  # Redpanda — Kafka-compatible event streaming (optional profile)
  # ─────────────────────────────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: freshflow-redpanda
    profiles: ["streaming"]
    command:
      - redpanda start
      - --smp 1
      - --memory 256M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - freshflow-net

  redpanda-console:
    image: redpandadata/console:latest
    container_name: freshflow-redpanda-console
    profiles: ["streaming"]
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: "redpanda:29092"
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - freshflow-net

  # ─────────────────────────────────────────────────────────────────────────
  # Monitoring (optional profile)
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: freshflow-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - freshflow-net

  grafana:
    image: grafana/grafana:latest
    container_name: freshflow-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-freshflow_grafana}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - freshflow-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  airflow_logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  freshflow-net:
    driver: bridge
